# Oracle Cloud / VPS deployment — see DEPLOY.md
services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
